<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><title>Fleet · review</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* [hidden] only works via the browser's lowest-priority stylesheet rule —
     .row's explicit display:flex silently wins over it. Force it. */
  [hidden]{display:none !important;}
  body{font:15px/1.5 system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#132}
  h1{font-size:1.4rem;margin:0 0 1.2rem}
  h2{font-size:1.1rem;margin:1.6rem 0 .4rem}
  .card{border:1px solid #dde;border-radius:8px;padding:.9rem 1rem;margin:.6rem 0}
  .card h3{margin:0 0 .2rem;font-size:1.05rem}
  .meta{color:#678;font-size:.87rem}
  .oid{font-family:ui-monospace,monospace;background:#f2f5f8;padding:.1rem .4rem;border-radius:4px}
  button{font:inherit;padding:.35rem .8rem;border-radius:6px;border:1px solid #bcd;background:#fff;cursor:pointer}
  button.ok{background:#0a6;border-color:#0a6;color:#fff}
  input{font:inherit;padding:.4rem .5rem;border:1px solid #bcd;border-radius:6px}
  .row{display:flex;gap:.5rem;align-items:center;margin-top:.6rem;flex-wrap:wrap}
  .badge{font-size:.75rem;background:#0a6;color:#fff;padding:.1rem .45rem;border-radius:99px}
  .muted{color:#89a}
</style></head><body>

<h1>Fleet review</h1>

<div id="gate">
  <p>Sign in with the address registered as class admin.</p>
  <div class="row">
    <input id="email" type="email" placeholder="you@example.com" size="28">
    <button class="ok" id="send">Send code</button>
  </div>
  <div class="row" id="codeRow" hidden="">
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="sign-in code" size="16">
    <button class="ok" id="verify">Verify</button>
  </div>
  <p id="gateMsg" class="muted"></p>
</div>

<main id="app" hidden="">
  <p class="muted">Signed in as <span id="who"></span> · <a href="#" id="out">sign out</a></p>
  <div class="row">
    <label><input type="checkbox" id="showAll"> show entries without an order ID</label>
  </div>
  <h2 id="hPend">Pending</h2><div id="pending"></div>
  <h2>Verified</h2><div id="done"></div>

  <h2 id="hBomPend">Sourcing submissions — pending</h2><div id="bomPending"></div>
  <h2>Sourcing submissions — approved</h2><div id="bomApproved"></div>
</main>

<script>
const SUPABASE_URL = 'https://fftavybqhrvjbeofqrnc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdGF2eWJxaHJ2amJlb2Zxcm5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzI0NTMsImV4cCI6MjEwMjcwODQ1M30.2plNkkCD__49SKfcuoVSinvKlApGiX750r4bPbBlkR0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

$('#send').onclick = async () => {
  const email = $('#email').value.trim();
  if (!email) return;
  $('#send').disabled = true;
  $('#gateMsg').textContent = 'Sending…';
  const { error } = await sb.auth.signInWithOtp({ email });
  $('#send').disabled = false;
  if (error) { $('#gateMsg').textContent = error.message; return; }
  $('#gateMsg').textContent = 'Check your inbox for a sign-in code.';
  $('#codeRow').hidden = false;
  $('#code').focus();
};
$('#verify').onclick = async () => {
  const email = $('#email').value.trim();
  const code = $('#code').value.trim();
  if (!email || !code) return;
  $('#verify').disabled = true;
  $('#gateMsg').textContent = 'Verifying…';
  const { error } = await sb.auth.verifyOtp({ email, token: code, type: 'email' });
  $('#verify').disabled = false;
  if (error) { $('#gateMsg').textContent = error.message; return; }
};
$('#out').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };
$('#showAll').onchange = load;

sb.auth.getSession().then(({ data }) => boot(data.session));
sb.auth.onAuthStateChange((_evt, session) => boot(session));

let current = null;
async function boot(session) {
  const uid = session ? session.user.id : null;
  if (uid === current) return;      // evita recarregar duas vezes
  current = uid;
  if (!session) { $('#gate').hidden = false; $('#app').hidden = true; return; }
  const { data: isAdmin, error } = await sb.rpc('is_class_admin');
  if (error || !isAdmin) {
    $('#gate').hidden = false; $('#app').hidden = true;
    $('#gateMsg').textContent = error ? error.message
      : 'Signed in, but this address is not on the class admin list.';
    return;
  }
  $('#gate').hidden = true; $('#app').hidden = false;
  $('#who').textContent = session.user.email;
  load();
  loadBom();
}

const CATEGORY_LABELS = {
  sail_fabric: 'Sail fabric', carbon: 'Carbon', electronics: 'Electronics',
  hardware: 'Hardware', epoxy: 'Epoxy', other: 'Other'
};
const PART_LABELS = {
  tx_rx_combo: 'Transmitter / Receiver / Combo', servos: 'Servos',
  battery: 'Battery', charger: 'Charger',
  ballast_bolt: 'Ballast bolt — M12 stainless, 100–150mm',
  carbon_3mm: '3mm carbon rod — Mast 250mm + Rig jointer 37mm (min. 287mm, buy extra)',
  carbon_2mm: '2mm carbon rod — Boom 154mm + Rig pivot 33mm + Keel stiffener 78mm + Rudder stock 32mm (min. 297mm, buy extra)',
  rod_clips: 'MinimumRC rod clips', fishing_braid: 'Fishing braid (8–10lb)',
  sail_fabric: 'Sail fabric (buy extra for A/B/future C rig)', epoxy: 'Epoxy / adhesive', other: 'Other'
};
const SHIPS_TO_LABELS = {
  worldwide: 'Worldwide', europe: 'Europe', north_america: 'North America',
  oceania: 'Oceania', domestic_only: 'Domestic only', other: 'Other (see notes)'
};

async function loadBom() {
  const { data, error } = await sb.from('bom_sources')
    .select('id,category,country,region,supplier_name,link,product_link,contact_note,notes,approved,approved_note,approved_at,created_at,part_name,ships_to');
  if (error) { $('#bomPending').textContent = error.message; return; }

  const pend = data.filter(b => !b.approved);
  const done = data.filter(b => b.approved);
  pend.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  done.sort((a, b) => (b.approved_at || '').localeCompare(a.approved_at || ''));

  $('#hBomPend').textContent = `Sourcing submissions — pending (${pend.length})`;
  $('#bomPending').innerHTML = pend.length ? pend.map(bomCard).join('')
    : '<p class="muted">Nothing to review.</p>';
  $('#bomApproved').innerHTML = done.length ? done.map(bomCard).join('')
    : '<p class="muted">None yet.</p>';
  document.querySelectorAll('[data-bomact]').forEach(b => b.onclick = bomAct);
}

function bomCard(b) {
  const place = [b.region, b.country].filter(Boolean).join(', ');
  return `<div class="card">
    <h3>${esc(b.supplier_name)}
      ${b.approved ? '<span class="badge">approved</span>' : ''}</h3>
    <div class="meta">${esc(PART_LABELS[b.part_name] || CATEGORY_LABELS[b.category] || b.category)} · ${esc(place)}</div>
    ${b.ships_to ? `<div class="meta">ships to: ${esc(SHIPS_TO_LABELS[b.ships_to] || b.ships_to)}</div>` : ''}
    ${b.link ? `<div class="meta">supplier: <a href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.link)}</a></div>` : ''}
    ${b.product_link ? `<div class="meta">product: <a href="${esc(b.product_link)}" target="_blank" rel="noopener">${esc(b.product_link)}</a></div>` : ''}
    ${b.contact_note ? `<div class="meta">contact: ${esc(b.contact_note)}</div>` : ''}
    ${b.notes ? `<div class="meta">notes: ${esc(b.notes)}</div>` : ''}
    ${b.approved_note ? `<div class="meta">admin note: ${esc(b.approved_note)}</div>` : ''}
    <div class="row">
      <input placeholder="note (optional)" size="30" id="bn-${b.id}">
      ${b.approved
        ? `<button data-bomact="off" data-id="${b.id}">Unpublish</button>`
        : `<button class="ok" data-bomact="on" data-id="${b.id}">Approve</button>`}
      <button data-bomact="del" data-id="${b.id}" style="border-color:#c55;color:#c55;">Delete</button>
    </div></div>`;
}

async function bomAct(e) {
  const btn = e.currentTarget, id = btn.dataset.id, act = btn.dataset.bomact;

  if (act === 'del') {
    if (!confirm('Delete this submission permanently? This cannot be undone.')) return;
    btn.disabled = true; btn.textContent = '…';
    const { error } = await sb.from('bom_sources').delete().eq('id', id);
    if (error) alert(error.message);
    loadBom();
    return;
  }

  const note = ($('#bn-' + id)?.value || '').trim() || null;
  btn.disabled = true; btn.textContent = '…';
  const { error } = await sb.rpc('approve_bom_source', { p_id: id, p_approved: act === 'on', p_note: note });
  if (error) alert(error.message);
  loadBom();
}

async function load() {
  const { data, error } = await sb.from('boats')
    .select('id,display_name,email,country,region,locality,order_id,boats_built,role,status,photo_url,verified,verified_at,verified_note,public_profile,created_at');
  if (error) { $('#pending').textContent = error.message; return; }

  const all = $('#showAll').checked;
  const pend = data.filter(b => !b.verified && (all || b.order_id));
  const done = data.filter(b => b.verified);
  pend.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  done.sort((a, b) => (b.verified_at || '').localeCompare(a.verified_at || ''));

  $('#hPend').textContent = `Pending (${pend.length})`;
  $('#pending').innerHTML = pend.length ? pend.map(card).join('')
    : '<p class="muted">Nothing to review.</p>';
  $('#done').innerHTML = done.length ? done.map(card).join('')
    : '<p class="muted">None yet.</p>';
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = act);
}

function card(b) {
  const place = [b.locality, b.region, b.country].filter(Boolean).join(', ');
  return `<div class="card">
    <h3>${esc(b.display_name) || '<span class="muted">(no name)</span>'}
      ${b.verified ? '<span class="badge">verified</span>' : ''}</h3>
    <div class="meta">${esc(b.email)}</div>
    <div class="meta">${esc(place)} · ${esc(b.role)} · ${esc(b.status)}
      · built: ${esc(b.boats_built ?? '—')}
      ${b.public_profile ? '' : ' · <em>private</em>'}</div>
    <div class="meta">order ID: ${b.order_id
      ? `<span class="oid">${esc(b.order_id)}</span>`
      : '<span class="muted">none supplied</span>'}
      ${b.photo_url ? ` · <a href="${esc(b.photo_url)}" target="_blank" rel="noopener">photo</a>` : ''}</div>
    ${b.verified_note ? `<div class="meta">note: ${esc(b.verified_note)}</div>` : ''}
    <div class="row">
      <input placeholder="note (optional)" size="30" id="n-${b.id}">
      ${b.verified
        ? `<button data-act="off" data-id="${b.id}">Withdraw</button>`
        : `<button class="ok" data-act="on" data-id="${b.id}">Verify</button>`}
    </div></div>`;
}

async function act(e) {
  const btn = e.currentTarget, id = btn.dataset.id, on = btn.dataset.act === 'on';
  const note = ($('#n-' + id)?.value || '').trim() || null;
  btn.disabled = true; btn.textContent = '…';
  const { error } = await sb.rpc('set_verification',
    { p_boat: id, p_verified: on, p_note: note });
  if (error) alert(error.message);
  load();
}
</script>
</body></html>
